
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador de funciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Clasificador de funciones</h1>

    <main>

        <p id="valorB">b = ?</p>

        <p id="valorC">c = ?</p>

        <button id="generar">Generar / Cambiar</button>

        <div id="cajaLineal">
            <h3>LINEAL</h3>
            <p id="propiedadesLineal">
                Muestra las propiedades de la función lineal.
            </p>
        </div>

        <div id="cajaAfin">
            <h3>AFÍN</h3>
            <p id="propiedadesAfin">
                Muestra las propiedades de la función afín.
            </p>
        </div>

        <hr>

        <p>
            <strong>ENLACE:</strong>
            <a href="https://www.geogebra.org/classic" target="_blank">
                GeoGebra Clásico
            </a>
        </p>

        <input type="file" id="archivo" accept=".ggb">

        <p id="nombreArchivo"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
